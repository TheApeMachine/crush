version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/sql"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "integer"
            go_type: "int64"
          - db_type: "text"
            go_type: "string"
